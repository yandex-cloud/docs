title: Yandex Cloud Backup
description:
  - >-
    With Yandex Cloud Backup, you can set up automatic backups for <a
    href="/docs/compute">Yandex Compute Cloud</a> VMs, <a
    href="/docs/baremetal">Yandex BareMetal</a> servers, as well as VMs and
    servers in the user or third-party provider infrastructure.
