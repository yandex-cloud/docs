meta:
  title: Yandex Cloud Backup
  description: >-
    With {{ backup-full-name }}, you can set up automatic backups for VMs and
    servers both inside and outside {{ yandex-cloud }}.
  keywords:
    - keyword: backup
    - keyword: yandex backup
    - keyword: '{{ backup-name }}'
    - keyword: '{{ backup-full-name }}'
    - keyword: '{{ backup-name }}'
    - keyword: backups in {{ yandex-cloud }}
    - keyword: backing up in {{ yandex-cloud }}
    - keyword: backups
    - keyword: backing up
blocks:
  - type: card-layout-block
    title: Yandex Cloud Backup
    description: >-
      With Yandex Cloud Backup, you can set up automatic backups for [Yandex
      Compute Cloud](../compute/) VMs, [Yandex BareMetal](../baremetal/)
      servers, as well as VMs and servers in your own or third-party
      infrastructure.
    colSizes:
      all: 12
      sm: 6
      md: 6
      lg: 4
    children:
      - type: basic-card
        title: Getting started
        text: Connect a VM to the service and create a backup
        gravityIcon:
          name: Rocket
          color: text-color
        urlTitle: Getting started
        url: quickstart/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Step-by-step guides
        text: Follow guides to perform routine operations
        gravityIcon:
          name: ListOl
          color: text-color
        urlTitle: Step-by-step guides
        url: operations/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Concepts
        text: Learn about backups, backup policies, and the Cloud Backup agent
        gravityIcon:
          name: Bookmark
          color: text-color
        urlTitle: Concepts
        url: concepts/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Tutorials
        text: Use the service to address common tasks
        gravityIcon:
          name: Book
          color: text-color
        urlTitle: Tutorials
        url: tutorials/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Quotas
        text: Technical and organizational limitations of the service
        gravityIcon:
          name: Sliders
          color: text-color
        urlTitle: Quotas
        url: concepts/limits
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Access management
        text: Configure access permissions for the service
        gravityIcon:
          name: PersonsLock
          color: text-color
        urlTitle: Access management
        url: security/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Pricing policy
        text: Prices and cost calculation rules
        gravityIcon:
          name: Calculator
          color: text-color
        urlTitle: Pricing policy
        url: pricing
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Changelog
        text: Updates to the service
        gravityIcon:
          name: Timeline
          color: text-color
        urlTitle: Changelog
        url: release-notes
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Troubleshooting
        text: Learn how to troubleshoot issues with the service
        gravityIcon:
          name: CircleQuestion
          color: text-color
        urlTitle: Troubleshooting
        url: qa/troubleshooting
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: CLI reference
        text: Manage service resources from the command line
        gravityIcon:
          name: Terminal
          color: text-color
        urlTitle: CLI reference
        url: cli-ref/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Terraform reference
        text: Create and update service resources using Terraform
        gravityIcon:
          name: Cube
          color: text-color
        urlTitle: Terraform reference
        url: tf-ref
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: API reference
        text: Use HTTP API methods to manage the service
        gravityIcon:
          name: Code
          color: text-color
        urlTitle: API reference
        url: backup/api-ref/
        centered: true
        animated: false
        size: s
  - type: card-layout-block
    colSizes:
      all: 12
      xl: 6
      lg: 6
      md: 6
      sm: 12
    centered: true
    children:
      - type: basic-card
        title: Terms of use
        border: shadow
        size: s
        gravityIcon:
          name: FileText
          color: text-color
        text: >
          The Yandex Cloud infrastructure is
          [protected](https://yandex.cloud/en/docs/security/conform#law)
          pursuant to the Russian Federal Law No. 152-FZ on Personal Data.


          * [Terms of use for Yandex Cloud
          Backup](https://yandex.ru/legal/cloud_terms_backup)


          * [Terms of use for Yandex
          Cloud](https://yandex.ru/legal/cloud_specialterms)
      - type: basic-card
        title: Service level
        border: shadow
        size: s
        gravityIcon:
          name: FileCheck
          color: text-color
        text: >
          * [Service level for Yandex Cloud
          Backup](https://yandex.ru/legal/cloud_sla_backup)


          * [Service level for Yandex Cloud](https://yandex.ru/legal/cloud_sla)
