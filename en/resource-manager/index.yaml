blocks:
  - type: card-layout-block
    title: "Yandex\_Identity\_and\_Access\_Management"
    description: >-
      Yandex Resource Manager defines the Yandex Cloud resource model and allows
      you to use folders to structure your resources.


      The Yandex Cloud infrastructure is
      [protected](https://storage.yandexcloud.net/yc-compliance/conformance_en_pdp.pdf)
      pursuant to the Russian Federal Law No. 152-FZ on Personal Data.
    colSizes:
      all: 12
      sm: 6
      md: 6
      lg: 3
    children:
      - type: basic-card
        title: Getting started
        text: Create your first folder
        size: s
        urlTitle: "How to create your first folder in Yandex\_Cloud"
        url: quickstart
        icon: ../_assets/console-icons/rocket.svg
        controlPosition: content
        animated: false
      - type: basic-card
        title: Step-by-step guides
        text: Follow our guides for routine operations
        size: s
        urlTitle: "Step-by-step guides on Resource\_Manager"
        url: operations/index
        icon: ../_assets/console-icons/list-ol.svg
        controlPosition: content
        animated: false
      - type: basic-card
        title: Concepts
        text: Introduction to the basic terms and concepts
        size: s
        urlTitle: "Yandex\_Cloud resource hierarchy"
        url: concepts/index
        icon: ../_assets/console-icons/bookmark.svg
        controlPosition: content
        animated: false
      - type: basic-card
        title: API reference
        text: "Use HTTP\_API methods to manage resources in Yandex\_Cloud"
        size: s
        urlTitle: "HTTP\_API method descriptions"
        icon: ../_assets/console-icons/code.svg
        url: api-ref/
        controlPosition: content
        animated: false
      - type: basic-card
        title: Quotas and limits
        text: Technical and organizational limitations
        size: s
        urlTitle: "Quotas and limits in Resource\_Manager"
        url: concepts/limits
        icon: ../_assets/console-icons/sliders.svg
        controlPosition: content
        animated: false
      - type: basic-card
        title: Manage access
        text: "Access permissions for Resource\_Manager"
        size: s
        urlTitle: "Access management in Resource\_Manager"
        url: security/index
        icon: ../_assets/console-icons/persons-lock.svg
        controlPosition: content
        animated: false
      - type: basic-card
        title: Release notes
        text: Releases and updates
        size: s
        urlTitle: "Yandex\_Resource\_Manager release notes"
        url: release-notes
        icon: ../_assets/console-icons/timeline.svg
        controlPosition: content
        animated: false
links: []
