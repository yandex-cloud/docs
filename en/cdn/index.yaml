        url: tf-ref
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: API reference
        text: Use HTTP API methods to manage the service
        icon: ../_assets/console-icons/code.svg
        urlTitle: API reference
        url: api-ref/
        centered: true
        animated: false
        size: s
