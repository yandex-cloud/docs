blocks:
  - type: card-layout-block
    title: Yandex Cloud CDN
    description: >-
      Yandex Cloud CDN enables you to set up content delivery to your end users
      over a content delivery network (CDN). Caching on CDN servers reduces the
      load on data sources and speeds up content delivery.
    colSizes:
      all: 12
      sm: 6
      md: 6
      lg: 4
    children:
      - type: basic-card
        title: Getting started
        text: Get started with content delivery over a CDN
        icon: ../_assets/console-icons/rocket.svg
        urlTitle: Getting started
        url: quickstart/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Step-by-step guides
        text: Follow our guides for routine operations
        icon: ../_assets/console-icons/list-ol.svg
        urlTitle: Step-by-step guides
        url: operations/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Concepts
        text: Learn how a CDN works and explore core Cloud CDN concepts
        icon: ../_assets/console-icons/bookmark.svg
        urlTitle: Concepts
        url: concepts/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Tutorials
        text: Solve standard tasks using the service
        icon: ../_assets/console-icons/book.svg
        urlTitle: Tutorials
        url: tutorials/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Quotas and limits
        text: Technical and organizational limitations
        icon: ../_assets/console-icons/sliders.svg
        urlTitle: Quotas and limits
        url: concepts/limits
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Access management
