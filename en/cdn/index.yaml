        url: security/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Pricing policy
        text: Prices and cost calculation rules
        icon: ../_assets/console-icons/calculator.svg
        urlTitle: Pricing policy
        url: pricing
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Release notes
        text: Releases and updates
        icon: ../_assets/console-icons/timeline.svg
        urlTitle: Release notes
        url: release-notes
        centered: true
        animated: false
        size: s
      - type: basic-card
