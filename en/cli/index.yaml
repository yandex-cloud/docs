blocks:
  - type: card-layout-block
    title: Command line interface
    description: >-
      The Yandex Cloud CLI is downloadable software you can use to manage your
      cloud resources through the command line.
    colSizes:
      all: 12
      sm: 6
      md: 6
      lg: 4
    children:
      - type: basic-card
        title: Getting started
        text: Install the CLI and run your first command
        icon: ../_assets/console-icons/rocket.svg
        urlTitle: Getting started
        url: quickstart
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Step-by-step guides
        text: Follow guides to perform routine operations
        icon: ../_assets/console-icons/list-ol.svg
        urlTitle: Step-by-step guides
        url: operations/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: How to work with the CLI
        text: Running commands, working with profiles, and configuring the CLI
        icon: ../_assets/console-icons/terminal.svg
        urlTitle: How to work with the CLI
        url: concepts/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: CLI releases
        text: New features, changes, and fixes in the CLI
        icon: ../_assets/console-icons/timeline.svg
        urlTitle: CLI releases
        url: release-notes
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Troubleshooting
        text: Find out how to collect diagnostic information
        icon: ../_assets/console-icons/circle-question.svg
        urlTitle: Troubleshooting
        url: error
        centered: true
        animated: false
        size: s
      - type: basic-card
