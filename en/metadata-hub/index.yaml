meta:
  title: Yandex MetaData Hub
  description: >-
    Yandex MetaData Hub is a Yandex Cloud service that allows customers to
    manage database connections, store data exchange schemas, and describe
    datasets.
  keywords:
    - keyword: '{{ metadata-hub-name }}'
    - keyword: '{{ metadata-hub-name }}'
    - keyword: managing database connections in {{ yandex-cloud }}
    - keyword: data schemas in {{ yandex-cloud }}
    - keyword: data cluster in {{ yandex-cloud }}
    - keyword: data management in {{ yandex-cloud }}
    - keyword: managing database connections
    - keyword: metadata catalog in {{ yandex-cloud }}
blocks:
  - type: card-layout-block
    title: Yandex MetaData Hub
    visible:
      sm: false
      md: true
    description: "Yandex\_MetaData\_Hub is a Yandex\_Cloud service that allows customers to manage database connections, store data exchange schemas, and describe datasets, while also providing a metadata management system."
    colSizes:
      all: 12
      sm: 6
      md: 6
      lg: 3
    background: ''
    children:
      - type: basic-card
        title: Quotas and limits
        text: Technical and organizational limitations
        gravityIcon:
          name: Sliders
          color: text-color
        urlTitle: Quotas in Yandex MetaData Hub
        url: ./concepts/limits
        centered: true
        size: s
      - type: basic-card
        title: Manage access
        text: How to configure access permissions to use the service
        gravityIcon:
          name: Lock
          color: text-color
        urlTitle: Access management in Yandex MetaData Hub
        url: ./security/index
        centered: true
        size: s
      - type: basic-card
        title: Pricing policy
        text: Pricing and cost calculations
        gravityIcon:
          name: TagRuble
          color: text-color
        urlTitle: Pricing policy for Yandex MetaData Hub
        url: pricing
        centered: true
        size: s
      - type: basic-card
        title: Release notes
        text: Updates and changes
        gravityIcon:
          name: Timeline
          color: text-color
        urlTitle: Yandex MetaData Hub release notes
        url: release-notes/index
        centered: true
        size: s
  - type: card-layout-block
    colSizes:
      all: 12
      sm: 6
      md: 6
    background: ''
    title: Metadata management in Yandex Cloud
    children:
      - type: basic-card
        title: Connection Manager
        text: Automatically creating and managing database connection settings.
        urlTitle: Connection
        url: ./concepts/connection-manager
        size: s
        gravityIcon:
          name: PlugConnection
          color: text-color
      - type: basic-card
        title: Apache Hive™ Metastore
        text: Creating and managing Apache Hive™ Metastore clusters.
        urlTitle: Apache Hive™ Metastore clusters
        url: concepts/metastore
        size: s
        gravityIcon:
          name: Database
          color: text-color
      - type: basic-card
        title: Schema Registry
        text: >-
          Centralized repository for managing and validating data schemas. The
          service is at the Preview stage.
        urlTitle: Data schema registry
        url: ./concepts/schema-registry
        size: s
        gravityIcon:
          name: LayoutCells
          color: text-color
      - type: basic-card
        title: Data Catalog
        text: >-
          Tool for collecting, analyzing, and marking up metadata from various
          sources. The service is at the Preview stage.
        urlTitle: Metadata folder
        url: concepts/data-catalog
        size: s
        gravityIcon:
          name: FolderMagnifier
          color: text-color
  - type: content-layout-block
    textContent:
      title: ''
      text: >-
        Apache® and Apache Hive™ are registered trademarks or trademarks of the
        Apache Software Foundation in the United States and/or other countries.
links: []
