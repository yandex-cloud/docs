blocks:
  - type: card-layout-block
    title: Yandex Data Processing
    description: >-
      This service helps to deploy Apache Hadoop® and Apache Spark™ clusters on
      Yandex Cloud infrastructure. The cluster size, node capacity, and the
      selection of Apache® services (Spark™, HDFS, YARN, Hive, HBase®, Oozie™,
      Sqoop™, Flume™, Tez®, Zeppelin™) are all up to you.
    colSizes:
      all: 12
      sm: 6
      md: 6
      lg: 3
    children:
      - type: basic-card
        title: Getting started
        text: Create your first cluster
        gravityIcon:
          name: Rocket
          color: text-color
        urlTitle: Getting started with Yandex Data Processing
        url: quickstart
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Step-by-step guides
        text: Follow our guides for routine operations
        urlTitle: Step-by-step guides for Yandex Data Processing
        url: operations/index
        centered: true
        size: s
        animated: false
        gravityIcon:
          name: ListOl
          color: text-color
      - type: basic-card
        title: Concepts
        text: Introduction to the basic terms and concepts
        urlTitle: All concepts
        url: concepts/index
        centered: true
        size: s
        animated: false
        gravityIcon:
          name: Bookmark
          color: text-color
      - type: basic-card
        title: API reference
        text: Use HTTP API methods for cluster management
        urlTitle: Authentication in the Yandex Data Processing API
        url: api-ref/authentication
        centered: true
        size: s
        animated: false
        gravityIcon:
          name: Code
          color: text-color
      - type: basic-card
        title: Pricing policy
        text: Prices and cost calculation rules
        urlTitle: Yandex Data Processing pricing policy
        url: pricing
        centered: true
        animated: false
        size: s
        gravityIcon:
          name: Calculator
          color: text-color
      - type: basic-card
        title: Quotas and limits
        text: Technical and organizational limitations
        urlTitle: Quotas and limits
        url: concepts/limits
        centered: true
        size: s
        animated: false
        gravityIcon:
          name: Sliders
          color: text-color
      - type: basic-card
        title: Manage access
        text: Configure access permissions for the service
        urlTitle: Access management in Yandex Data Processing
        url: security/index
        centered: true
        animated: false
        size: s
        gravityIcon:
          name: PersonsLock
          color: text-color
      - type: basic-card
        title: Release notes
        text: Releases and updates
        gravityIcon:
          name: Timeline
          color: text-color
        urlTitle: Yandex Data Processing release notes
        url: release-notes/index
        centered: true
        size: s
  - type: card-layout-block
    colSizes:
      all: 12
    title: Terms of use
    description: ''
    iconPosition: left
    children:
      - type: basic-card
        title: ''
        text: >-
          The Yandex Cloud infrastructure protection complies with the following
          standards:

          * [Federal Law No. 152-FZ on Personal
          Data](https://yandex.cloud/en/docs/security/conform#law)


          * [GOST
          57580.1-2017](https://yandex.cloud/en/docs/security/conform#gost)

          * [PCI DSS](https://yandex.cloud/en/docs/security/conform#pci-dss)

          * [ISO standards](https://yandex.cloud/en/docs/security/conform#iso)
        gravityIcon:
          name: FileText
          color: text-color
        centered: true
        size: s
