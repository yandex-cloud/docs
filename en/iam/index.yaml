meta:
  title: Yandex Identity and Access Management
  description: >-
    Yandex Identity and Access Management (IAM) is an identification and access
    control service that helps you centrally manage user access rights to your
    Yandex Cloud resources.
  keywords:
    - keyword: '{{ iam-short-name }}'
    - keyword: '{{ iam-name }}'
    - keyword: '{{ iam-full-name }}'
    - keyword: '{{ iam-name }}'
    - keyword: identification in {{ yandex-cloud }}
    - keyword: access control in {{ yandex-cloud }}
    - keyword: access management in {{ yandex-cloud }}
    - keyword: identification and access management
    - keyword: managing user permissions
    - keyword: access management
blocks:
  - type: card-layout-block
    title: Yandex Identity and Access Management
    description: "Yandex\_Identity\_and\_Access\_Management\_(IAM) is an identification and access management service that helps you centrally manage user access to your Yandex\_Cloud resources. IAM makes sure all operations with resources are only performed by users who have the required permissions.\n\nThe Yandex Cloud infrastructure is [protected](https://storage.yandexcloud.net/yc-compliance/conformance_en_pdp.pdf) pursuant to the Russian Federal Law 152-FZ on Personal Data."
    colSizes:
      all: 12
      lg: 4
      sm: 4
    children:
      - type: basic-card
        title: Getting started
        text: Add a user and assign a role
        size: s
        urlTitle: "How to get started with Yandex\_Identity and Access\_Management"
        url: quickstart-overview
        icon: _assets/icons/rocket.svg
        controlPosition: content
        animated: false
      - type: basic-card
        title: Step-by-step guides
        text: Follow our guides for routine operations
        size: s
        urlTitle: "Step-by-step instructions for Identity and Access\_Management"
        url: operations/index
        icon: _assets/icons/list-ol.svg
        controlPosition: content
        animated: false
      - type: basic-card
        title: Concepts
        text: Introduction to the basic terms and concepts
        size: s
        urlTitle: "Overview of Yandex\_Identity and Access\_Management"
        url: concepts/index
        icon: _assets/icons/bookmark.svg
        controlPosition: content
        animated: false
      - type: basic-card
        title: Role reference
        text: "Yandex\_Cloud role reference"
        size: s
        urlTitle: "Yandex\_Cloud role reference"
        url: roles-reference
        icon: _assets/icons/book-open.svg
        controlPosition: content
        animated: false
      - type: basic-card
        title: API reference
        text: "Use HTTP\_API methods to manage access"
        size: s
        urlTitle: "HTTP\_API method descriptions"
        url: api-ref/
        icon: _assets/icons/code.svg
        controlPosition: content
        animated: false
      - type: basic-card
