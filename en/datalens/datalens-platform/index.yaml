meta:
  title: Yandex DataLens Platform
  description: >-
    {{ datalens-platform-full-name }} is an analytical platform for uploading,
    storing, processing, and visualizing data. Lakehouse on Apache Iceberg™,
    Trino and Apache Spark™ computations, Apache Airflow™ pipelines, dashboards,
    and Neuroanalyst in one interface.
  alternate:
    - href: en/datalens/datalens-platform/index.yaml
      type: application/yaml
      title: Yaml version
blocks:
  - type: header-block
    title: Yandex DataLens Platform documentation
    width: l
    offset: l
    indent:
      top: xl
      bottom: l
    background:
      image:
        desktop: ../../_assets/datalens/index/images/2.jpg
        mobile: ../../_assets/datalens/index/images/1.jpg
  - type: content-layout-block
    textWidth: l
    textContent:
      text: >-
        Yandex DataLens Platform is a full-cycle data analytics platform: from
        uploading and storing data to data processing, analysis, and
        visualization. Connect sources, prepare data, and create dashboards in
        one interface.


        Store data in Apache Iceberg™ format, process data in Trino and Apache
        Spark™ clusters, and automate processing with Apache Airflow™. Use
        metadata catalogs and shared access permissions for working in teams.


        Query Neuroanalyst in a natural language to analyze data, create SQL
        queries, and render visualizations.
  - type: card-layout-block
    background:
      light:
        style:
          backgroundColor: '#ADC5FA'
    colSizes:
      all: 12
      sm: 6
      md: 6
      lg: 6
    title: "Yandex\_DataLens"
    centered: true
    children:
      - type: basic-card
        title: Storing and processing data
        centered: true
        text: You are in this section of the guides
        url: concepts
        textSize: s
        controlPosition: content
        animated: false
        backgroundColor: '#FFC4AE'
      - type: basic-card
        title: BI system for business
        centered: true
        url: ../index
        textSize: s
        controlPosition: content
        animated: false
        backgroundColor: '#A5CAF3'
  - type: card-layout-block
    background:
      light:
        style:
          backgroundColor: '#ADC5FA'
    colSizes:
      all: 12
      sm: 6
      md: 6
      lg: 6
    title: DataLens On-premises
    centered: true
    children:
      - type: basic-card
        title: BI system for business
        centered: true
        url: https://datalens.ru/on-premises/docs/en/concepts/
        textSize: s
