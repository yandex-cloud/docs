blocks:
  - type: card-layout-block
    title: Yandex Identity Hub
    description: >-
      Yandex Identity Hub is a cloud service for managing user accounts and
      access to corporate apps in a centralized way over SAML and OpenID Connect
      (identity provider) protocols.


      The Yandex Cloud infrastructure is
      [protected](https://storage.yandexcloud.net/yc-compliance/conformance_en_pdp.pdf)
      pursuant to the Russian Federal Law No. 152-FZ on Personal Data.


      This service is subject to a [service level
      agreement](https://yandex.com/legal/cloud_sla/en/). The service level is
      set out in the document titled [Yandex Identity Hub Service
      Level](https://yandex.com/legal/cloud_sla_identity_hub/en/).
    colSizes:
      all: 12
      lg: 4
      sm: 4
    children:
      - type: basic-card
        title: Getting started
        text: Create your first organization
        urlTitle: How to create your first organization
        url: quickstart
        centered: true
        animated: false
        size: s
        icon: ../_assets/console-icons/rocket.svg
      - type: basic-card
        title: Step-by-step guides
        text: Follow our guides for routine operations
        urlTitle: "Yandex\_Identity\_Hub guides"
        url: operations/index
        centered: true
        animated: false
        size: s
        icon: ../_assets/console-icons/list-ol.svg
      - type: basic-card
        title: Organization
        text: Study the key terms and concepts.
        urlTitle: "Organization in Yandex\_Cloud"
        url: concepts/organization
        centered: true
        animated: false
        size: s
        icon: ../_assets/console-icons/briefcase.svg
      - type: basic-card
        title: API reference
        text: "Use HTTP\_API methods to manage an organization"
        urlTitle: "HTTP\_API method descriptions"
        url: api-ref/
        centered: true
        animated: false
        size: s
        icon: ../_assets/console-icons/code.svg
      - type: basic-card
        title: Release notes
        text: Releases and updates
        urlTitle: "Yandex\_Identity\_Hub release notes"
        url: release-notes
