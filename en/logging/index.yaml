title: Yandex Cloud Logging
description:
  - >-
    Yandex Cloud Logging allows you to read and write the logs of services and
    user applications by grouping messages into log groups.
  - >-
    As of October 22, 2026, the {{ cloud-logging-full-name }} service has been
    discontinued for new customers, including {{ yandex-cloud }} customers who
    have not previously used this service. This restriction applies to both paid
    and free use. Use the <a href="../monium/">{{ monium-name }}</a>
    observability platform instead of {{ cloud-logging-name }}.
