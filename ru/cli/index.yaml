meta:
  title: CLI Yandex Cloud
  description: >-
    CLI {{ yandex-cloud }} — скачиваемое программное обеспечение для управления
    вашими облачными ресурсами через командную строку.
  keywords:
    - keyword: cli
    - keyword: yandex cli
    - keyword: yc cli
    - keyword: command line interface
    - keyword: интерфейс командной строки
    - keyword: командная оболочка
    - keyword: command line interface {{ yandex-cloud }}
    - keyword: интерфейс командной строки {{ yandex-cloud }}
    - keyword: командная оболочка {{ yandex-cloud }}
    - keyword: командная строка yandex
    - keyword: командная строка {{ yandex-cloud }}
blocks:
  - type: card-layout-block
    title: Интерфейс командной строки
    description: >-
      CLI Yandex Cloud — скачиваемое программное обеспечение для управления
      вашими облачными ресурсами через командную строку.
    colSizes:
      all: 12
      sm: 6
      md: 6
      lg: 4
    children:
      - type: basic-card
        title: Начало работы
        text: Установите CLI и выполните первую команду
        icon: ../_assets/console-icons/rocket.svg
        urlTitle: Начало работы
        url: quickstart
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Пошаговые инструкции
        text: Следуйте инструкциям для выполнения рутинных операций
        icon: ../_assets/console-icons/list-ol.svg
        urlTitle: Пошаговые инструкции
        url: operations/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Принципы работы с CLI
        text: Запуск команд, работа с профилями и конфигурация CLI
        icon: ../_assets/console-icons/terminal.svg
        urlTitle: Принципы работы с CLI
        url: concepts/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Релизы CLI
        text: Новые возможности, изменения и исправления в CLI
        icon: ../_assets/console-icons/timeline.svg
        urlTitle: Релизы CLI
        url: release-notes
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Решение проблем
        text: Узнайте, как собрать диагностическую информацию
        icon: ../_assets/console-icons/circle-question.svg
        urlTitle: Решение проблем
        url: error
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Справочник CLI (англ.)
        text: Найдите нужные команды и их параметры
        icon: ../_assets/console-icons/code.svg
        urlTitle: Справочник CLI (англ.)
        url: cli-ref/
        centered: true
        animated: false
        size: s
links: []
