meta:
  title: Yandex DataLens
  description: >-
    Yandex DataLens — сервис бизнес-аналитики для визуализации данных.
    Подключайтесь к различным источникам и визуализируйте данные, собирайте
    дашборды, формируйте отчеты в виде интерактивных презентаций и принимайте
    решения на основе данных с помощью Нейроаналитика.
  keywords:
    - keyword: '{{ datalens-name }}'
    - keyword: '{{ datalens-full-name }}'
    - keyword: Сервис {{ datalens-name }}
    - keyword: Сервис для бизнес аналитики
    - keyword: BI аналитика
    - keyword: Визуализация данных в {{ yandex-cloud }}
    - keyword: Как подключиться к источнику данных
    - keyword: бизнес-метрики в {{ yandex-cloud }}
    - keyword: Аналитика {{ yandex-cloud }}
blocks:
  - type: header-block
    title: Документация Yandex DataLens
    centered: true
    width: l
    offset: l
    indent:
      top: xl
      bottom: l
    background:
      image:
        desktop: ../_assets/datalens/index/images/2.jpg
        mobile: ../_assets/datalens/index/images/2.jpg
  - type: card-layout-block
    background:
      light:
        style:
          backgroundColor: '#ADC5FA'
    colSizes:
      all: 12
      sm: 6
      md: 6
    title: "Yandex\_DataLens"
    centered: true
    children:
      - type: basic-card
        title: BI-система для бизнеса
        text: Вы в этом разделе документации
        gravityIcon:
          name: LayoutHeaderSideContent
          color: text-color
        url: concepts
        size: s
        controlPosition: content
        animated: false
        backgroundColor: '#FFC4AE'
      - type: basic-card
        title: Хранение и обработка данных
        gravityIcon:
          name: DatabaseArrowRight
          color: text-color
        url: ./datalens-platform/index
        size: s
        controlPosition: content
        animated: false
        backgroundColor: '#A5CAF3'
  - type: card-layout-block
    background:
      light:
        style:
          backgroundColor: '#ADC5FA'
    colSizes:
      all: 12
      sm: 6
      md: 6
    title: DataLens On-premises
    centered: true
    children:
      - type: basic-card
        title: BI-система для бизнеса
        gravityIcon:
          name: LayoutHeaderSideContent
          color: text-color
        url: https://datalens.ru/on-premises/docs/ru/concepts/
        size: s
        controlPosition: content
        animated: false
        backgroundColor: '#A5CAF3'
      - type: basic-card
        title: Хранение и обработка данных
        gravityIcon:
          name: DatabaseArrowRight
          color: text-color
        text: Скоро!
        url: ''
        size: s
        controlPosition: content
        animated: false
        backgroundColor: '#A5CAF3'
  - type: card-layout-block
    colSizes:
      all: 12
      sm: 6
      md: 6
      lg: 3
    children:
      - type: basic-card
        title: Начало работы
        text: Как начать работать с DataLens
        gravityIcon:
          name: Rocket
          color: text-color
        urlTitle: Начало работы
        url: quickstart
        size: s
        controlPosition: content
        animated: false
      - type: basic-card
        title: Правила тарификации
        text: Цены и правила расчета стоимости услуг сервиса
        gravityIcon:
          name: Calculator
          color: text-color
        urlTitle: Правила тарификации
        url: pricing
        size: s
        controlPosition: content
        animated: false
      - type: basic-card
        title: Квоты и лимиты
        text: Технические и организационные ограничения сервиса
        gravityIcon:
          name: Sliders
          color: text-color
        urlTitle: Квоты и лимиты
        url: ./concepts/limits
        size: s
        controlPosition: content
        animated: false
      - type: basic-card
        title: Управление доступом
        text: Какие права доступа нужны для работы с сервисом
        gravityIcon:
          name: PersonsLock
          color: text-color
        urlTitle: Управление доступом
        url: security/index
        size: s
        controlPosition: content
        animated: false
  - type: card-layout-block
    colSizes:
      all: 12
      lg: 4
      md: 6
      sm: 6
    background:
      light:
        style:
          backgroundColor: '#ADC5FA'
    title: "Визуализация\_данных\_в\_DataLens"
    centered: true
    children:
      - type: basic-card
        title: Нейроаналитик
        text: Поможет интерпретировать ваши данные и написать код
        gravityIcon:
          name: SparklesFill
          color: text-color
        urlTitle: Нейроаналитик
        url: ./concepts/neuroanalyst
        size: s
        controlPosition: content
        animated: false
        backgroundColor: '#A5CAF3'
      - type: basic-card
        title: Подключения
        text: Подключайте различные источники данных
        gravityIcon:
          name: Thunderbolt
          color: text-color
        urlTitle: Подключения
        url: concepts/connection/index
        size: s
        controlPosition: content
        animated: false
        backgroundColor: '#A5CAF3'
      - type: basic-card
        title: Датасеты
        text: Описывайте структуру данных, полученных из источника
        gravityIcon:
          name: CirclesIntersection
          color: text-color
        urlTitle: Датасеты
        url: dataset/index
        size: s
        controlPosition: content
        animated: false
        backgroundColor: '#A5CAF3'
      - type: basic-card
        title: HTML-страницы
        text: Готовые HTML-страниц в DataLens
        gravityIcon:
          name: Layers3Diagonal
          color: text-color
        urlTitle: Галерея в DataLens
        url: ./concepts/gallery
        size: s
        controlPosition: content
        animated: false
        backgroundColor: '#A5CAF3'
      - type: basic-card
        title: Галерея в DataLens
        text: Готовые дашборды для вдохновения и решения бизнес-задач
        gravityIcon:
          name: Layers3Diagonal
          color: text-color
        urlTitle: Галерея в DataLens
        url: ./concepts/gallery
        size: s
        controlPosition: content
        animated: false
        backgroundColor: '#A5CAF3'
      - type: basic-card
        title: Обучающие курсы
        text: Информация о доступных программах обучения
        gravityIcon:
          name: GraduationCap
          color: text-color
        urlTitle: Обучающие курсы
        url: training
        size: s
        controlPosition: content
        animated: false
        backgroundColor: '#A5CAF3'
      - type: basic-card
        title: Чарты
        text: >-
          Стройте чарты с помощью Self-service-конструктора визуализаций или
          используйте JavaScript-кастомизацию
        gravityIcon:
          name: ChartColumn
          color: text-color
        urlTitle: Чарты
        url: concepts/chart/index
        size: s
        controlPosition: content
        animated: false
        backgroundColor: '#A5CAF3'
      - type: basic-card
        title: Дашборды
        text: Собирайте свои чарты на одной странице
        gravityIcon:
          name: LayoutCellsLarge
          color: text-color
        urlTitle: Дашборды
        url: ./concepts/dashboard
        size: s
        controlPosition: content
        animated: false
        backgroundColor: '#A5CAF3'
      - type: basic-card
        title: Отчеты
        text: Готовьте многостраничные документы для печати
        gravityIcon:
          name: DisplayPulse
          color: text-color
        urlTitle: Отчеты
        url: reports/index
        size: s
        controlPosition: content
        animated: false
        backgroundColor: '#A5CAF3'
links: []
