<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1232" height="640" viewBox="0 0 1232 640" role="img"
     aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Схема платформы Yandex DataLens Platform</title>
  <desc id="diagram-description">Загрузка данных → Lakehouse → Визуализация.
  Lakehouse включает хранение и обработку данных. Ниже расположены инструменты
  разработки и сквозные возможности. Обновлено по https://datalens.ru/platform;
  тексты и фигуры редактируются, внешние изображения и скрипты не используются.</desc>
  <defs>
    <clipPath id="canvas-clip"><rect width="1232" height="640" rx="24"/></clipPath>
    <linearGradient id="base-gradient" gradientUnits="userSpaceOnUse"
                    x1="22.14" y1="-36.83" x2="1209.86" y2="676.83">
      <stop stop-color="#021935"/>
      <stop offset="0.84" stop-color="#1d7ce3"/>
    </linearGradient>
    <linearGradient id="ai-gradient" gradientUnits="userSpaceOnUse" x1="3.87879" y1="0.484848" x2="8" y2="16">
      <stop stop-color="#ffbbb0"/><stop offset="1" stop-color="#8678ef"/>
    </linearGradient>
    <filter id="glass-blur" x="-30%" y="-60%" width="160%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <g id="background-art">
      <rect x="-400" y="-400" width="2032" height="1440" fill="url(#base-gradient)"/>

      <g transform="translate(5.1744 735.232) rotate(45) scale(1.24955294 1) translate(-343.358 -589.28)" style="mix-blend-mode:screen"><g xmlns="http://www.w3.org/2000/svg" filter="url(#warm-a)" style="mix-blend-mode:screen"><ellipse cx="343.358" cy="589.28" fill="url(#warm-b)" rx="205.314" ry="451.236" /></g><defs xmlns="http://www.w3.org/2000/svg"><radialGradient id="warm-b" cx="0" cy="0" r="1" gradientTransform="matrix(150.788 289.319 -222.434 440.258 377.325 523.323)" gradientUnits="userSpaceOnUse"><stop stop-color="#FEE9A2" /><stop offset=".412575" stop-color="#FFB000" /><stop offset=".867213" stop-color="#FF764D" stop-opacity=".5" /></radialGradient><filter id="warm-a" width="686.716" height="1178.56" x="0" y="0" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feFlood flood-opacity="0" result="BackgroundImageFix" /><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape" /><feGaussianBlur result="effect1_foregroundBlur_0_22" stdDeviation="69.0222" /></filter></defs></g>
      <g transform="translate(700.7616 50.048) rotate(23.29) scale(1.24943195 1.00001804) translate(-375.142 -249.4035)" style="mix-blend-mode:screen"><g xmlns="http://www.w3.org/2000/svg" filter="url(#cool-a)" style="mix-blend-mode:screen"><ellipse cx="375.142" cy="249.404" fill="url(#cool-b)" rx="275.142" ry="149.404" /></g><defs xmlns="http://www.w3.org/2000/svg"><radialGradient id="cool-b" cx="0" cy="0" r="1" gradientTransform="matrix(0 149.404 -275.142 0 375.142 249.404)" gradientUnits="userSpaceOnUse"><stop stop-color="#027BFE" /><stop offset=".8" stop-color="#021935" /></radialGradient><filter id="cool-a" width="750.284" height="498.807" x="0" y="0" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feFlood flood-opacity="0" result="BackgroundImageFix" /><feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape" /><feGaussianBlur result="effect1_foregroundBlur_0_19" stdDeviation="50" /></filter></defs></g>
    </g>
