meta:
  title: Yandex Cloud Detection and Response
  description: >-
    Сервис Yandex Cloud Detection and Response собирает данные о настройках
    инфраструктуры ваших сервисов в Yandex Cloud.
blocks:
  - type: card-layout-block
    title: Yandex Cloud Detection and Response
    description: >2-
       Сервис Yandex Cloud Detection and Response позволяет вести мониторинг и реагировать на инциденты в Yandex Cloud.

      YCDR разработан на базе собственного центра мониторинга безопасности (SOC)
      платформы Yandex Cloud.


      Сервис собирает данные с облачной инфраструктуры для выявления аномалий.
      При обнаружении аномалий YCDR создает
      [алерты](https://yandex.cloud/ru/docs/security-deck/concepts/alerts),
      указывающие на потенциальный инцидент.
    colSizes:
      all: 12
      lg: 6
      sm: 6
    children:
      - type: basic-card
        title: Начало работы
        text: Создайте первое расследование и выполните KQL-запрос
        size: s
        urlTitle: Как начать работать с Yandex Cloud Detection and Response
        url: quickstart
        icon: ../_assets/console-icons/rocket.svg
        controlPosition: content
        animated: false
      - type: basic-card
        title: Пошаговые инструкции
        text: Инструкции по созданию расследований и работе с запросами
        size: s
        urlTitle: Инструкции по работе с Yandex Cloud Detection and Response
        url: operations/index
        icon: ../_assets/console-icons/list-ol.svg
        controlPosition: content
        animated: false
      - type: basic-card
        title: Концепции
        text: Основные термины и понятия
        size: s
        urlTitle: Обзор Yandex Cloud Detection and Response
        url: concepts/index
        icon: ../_assets/console-icons/bookmark.svg
        controlPosition: content
        animated: false
      - type: basic-card
        title: Справочник KQL
        text: Описание синтаксиса языка запросов KQL
        size: s
        urlTitle: >-
          Справочник функций и операторов KQL в Yandex Cloud Detection and
