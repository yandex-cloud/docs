meta:
  title: Yandex Cloud Backup
  description: >-
    Сервис {{ backup-full-name }} позволяет настроить автоматическое резервное
    копирование виртуальных машин и серверов как на платформе {{ yandex-cloud
    }}, так и за ее пределами.
  keywords:
    - keyword: backup
    - keyword: yandex backup
    - keyword: '{{ backup-name }}'
    - keyword: '{{ backup-full-name }}'
    - keyword: сервис {{ backup-name }}
    - keyword: резервные копии в {{ yandex-cloud }}
    - keyword: резервное копирование в {{ yandex-cloud }}
    - keyword: резервные копии
    - keyword: резервное копирование
blocks:
  - type: card-layout-block
    title: Yandex Cloud Backup
    description: >-
      Сервис Yandex Cloud Backup позволяет настроить автоматическое резервное
      копирование виртуальных машин [Yandex Compute Cloud](../compute/),
      серверов [Yandex BareMetal](../baremetal/), а также виртуальных машин и
      серверов в инфраструктуре пользователя или сторонних провайдеров.
    colSizes:
      all: 12
      sm: 6
      md: 6
      lg: 4
    children:
      - type: basic-card
        title: Начало работы
        text: Подключите ВМ к сервису и создайте резервную копию
        gravityIcon:
          name: Rocket
          color: text-color
        urlTitle: Начало работы
        url: quickstart/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Пошаговые инструкции
        text: Следуйте инструкциям для выполнения рутинных операций
        gravityIcon:
          name: ListOl
          color: text-color
        urlTitle: Пошаговые инструкции
        url: operations/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Концепции
        text: >-
          Узнайте про резервные копии, политики копирования и агента Cloud
          Backup
        gravityIcon:
          name: Bookmark
          color: text-color
        urlTitle: Концепции
        url: concepts/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Практические руководства
        text: Решайте типовые задачи с помощью сервиса
        gravityIcon:
          name: Book
          color: text-color
        urlTitle: Практические руководства
        url: tutorials/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Квоты
        text: Технические и организационные ограничения сервиса
        gravityIcon:
          name: Sliders
          color: text-color
        urlTitle: Квоты
        url: concepts/limits
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Управление доступом
        text: Настройте права доступа для работы с сервисом
        gravityIcon:
          name: PersonsLock
          color: text-color
        urlTitle: Управление доступом
        url: security/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Правила тарификации
        text: Цены и правила расчета стоимости услуг сервиса
        gravityIcon:
          name: Calculator
          color: text-color
        urlTitle: Правила тарификации
        url: pricing
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: История изменений
        text: Перечень обновлений сервиса
        gravityIcon:
          name: Timeline
          color: text-color
        urlTitle: История изменений
        url: release-notes
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Решение проблем
        text: Узнайте, как решать проблемы при работе с сервисом
        gravityIcon:
          name: CircleQuestion
          color: text-color
        urlTitle: Решение проблем
        url: qa/troubleshooting
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Справочник CLI
        text: Управляйте ресурсами сервиса из командной строки
        gravityIcon:
          name: Terminal
          color: text-color
        urlTitle: Справочник CLI
        url: cli-ref/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Справочник Terraform
        text: Создавайте и изменяйте ресурсы сервиса с помощью Terraform
        gravityIcon:
          name: Cube
          color: text-color
        urlTitle: Справочник Terraform
        url: tf-ref
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Справочник API
        text: Используйте методы HTTP API для управления сервисом
        gravityIcon:
          name: Code
          color: text-color
        urlTitle: Справочник API
        url: backup/api-ref/
        centered: true
        animated: false
        size: s
  - type: card-layout-block
    colSizes:
      all: 12
      xl: 6
      lg: 6
      md: 6
      sm: 12
    centered: true
    children:
      - type: basic-card
        title: Условия использования
        border: shadow
        size: s
        gravityIcon:
          name: FileText
          color: text-color
        text: >
          Инфраструктура Yandex Cloud
          [защищена](https://yandex.cloud/ru/docs/security/conform#law) в
          соответствии с Федеральным законом Российской Федерации «О
          персональных данных» № 152-ФЗ.


          * [Условия использования Yandex Cloud
          Backup](https://yandex.ru/legal/cloud_terms_backup)


          * [Условия использования Yandex
          Cloud](https://yandex.ru/legal/cloud_specialterms)
      - type: basic-card
        title: Уровень обслуживания
        border: shadow
        size: s
        gravityIcon:
          name: FileCheck
          color: text-color
        text: >
          * [Уровень обслуживания Yandex Cloud
          Backup](https://yandex.ru/legal/cloud_sla_backup)


          * [Уровень обслуживания Yandex
          Cloud](https://yandex.ru/legal/cloud_sla)
links: []
