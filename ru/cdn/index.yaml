title: Yandex Cloud CDN
description:
  - >-
    {{ cdn-full-name }} позволяет организовать доставку контента до конечных
    пользователей с помощью сети распространения контента (Content Delivery
    Network, CDN).
  - >-
    Кеширование на CDN-серверах снижает нагрузку на источники данных и сокращает
    время доставки контента.
meta:
  title: Yandex Cloud CDN
  description: >-
    {{ cdn-full-name }} позволяет организовать доставку контента до конечных
    потребителей с помощью сети распространения контента (Content Delivery
    Network, CDN).
  keywords:
    - keyword: cdn
    - keyword: yandex cdn
    - keyword: '{{ cdn-name }}'
    - keyword: '{{ cdn-full-name }}'
    - keyword: сервис {{ cdn-name }}
    - keyword: сеть распространения контента в {{ yandex-cloud }}
    - keyword: content delivery network в {{ yandex-cloud }}
    - keyword: доставка контента в {{ yandex-cloud }}
    - keyword: сеть распространения контента
    - keyword: content delivery network
    - keyword: доставка контента
blocks:
  - type: card-layout-block
    title: Yandex Cloud CDN
    description: >-
      Yandex Cloud CDN позволяет организовать доставку контента до конечных
      пользователей с помощью сети распространения контента (Content Delivery
      Network, CDN). Кеширование на CDN-серверах снижает нагрузку на источники
      данных и сокращает время доставки контента.
    colSizes:
      all: 12
      sm: 6
      md: 6
      lg: 4
    children:
      - type: basic-card
        title: Начало работы
        text: Начните доставлять контент с помощью CDN
        gravityIcon:
          name: Rocket
          color: text-color
        urlTitle: Начало работы
        url: quickstart/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Пошаговые инструкции
        text: Следуйте инструкциям для выполнения рутинных операций
        gravityIcon:
          name: ListOl
          color: text-color
        urlTitle: Пошаговые инструкции
        url: operations/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Концепции
        text: Изучите принципы работы CDN и основные понятия сервиса
        gravityIcon:
          name: Bookmark
          color: text-color
        urlTitle: Концепции
        url: concepts/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Практические руководства
        text: Решайте типовые задачи с помощью сервиса
        gravityIcon:
          name: Book
          color: text-color
        urlTitle: Практические руководства
        url: tutorials/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Квоты и лимиты
        text: Технические и организационные ограничения сервиса
        gravityIcon:
          name: Sliders
          color: text-color
        urlTitle: Квоты и лимиты
        url: concepts/limits
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Управление доступом
        text: Настройте права доступа для работы с сервисом
        gravityIcon:
          name: PersonsLock
          color: text-color
        urlTitle: Управление доступом
        url: security/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Правила тарификации
        text: Цены и правила расчета стоимости услуг сервиса
        gravityIcon:
          name: Calculator
          color: text-color
        urlTitle: Правила тарификации
        url: pricing
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: История изменений
        text: Перечень обновлений сервиса
        gravityIcon:
          name: Timeline
          color: text-color
        urlTitle: История изменений
        url: release-notes
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Вопросы и ответы
        text: Ответы на частые вопросы и способы решения проблем
        gravityIcon:
          name: CircleQuestion
          color: text-color
        urlTitle: Вопросы и ответы
        url: troubleshooting
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Справочник CLI
        text: Управляйте ресурсами сервиса из командной строки
        gravityIcon:
          name: Terminal
          color: text-color
        urlTitle: Справочник CLI
        url: cli-ref/
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Справочник Terraform
        text: Создавайте и изменяйте ресурсы сервиса с помощью Terraform
        gravityIcon:
          name: Cube
          color: text-color
        urlTitle: Справочник Terraform
        url: tf-ref
        centered: true
        animated: false
        size: s
      - type: basic-card
        title: Справочник API
        text: Используйте методы HTTP API для управления сервисом
        gravityIcon:
          name: Code
          color: text-color
        urlTitle: Справочник API
        url: api-ref/
        centered: true
        animated: false
        size: s
  - type: card-layout-block
    colSizes:
      all: 12
      xl: 6
      lg: 6
      md: 6
      sm: 12
    centered: true
    children:
      - type: basic-card
        title: Условия использования
        border: shadow
        size: s
        gravityIcon:
          name: FileText
          color: text-color
        text: >
          Инфраструктура Yandex Cloud
          [защищена](https://yandex.cloud/ru/docs/security/conform#law) в
          соответствии с Федеральным законом Российской Федерации «О
          персональных данных» № 152-ФЗ.


          * [Условия использования Yandex Cloud
          CDN](https://yandex.ru/legal/cloud_terms_cdn)


          * [Условия использования Yandex
          Cloud](https://yandex.ru/legal/cloud_specialterms)
      - type: basic-card
        title: Уровень обслуживания
        border: shadow
        size: s
        gravityIcon:
          name: FileCheck
          color: text-color
        text: >
          * [Уровень обслуживания Yandex Cloud
          CDN](https://yandex.ru/legal/cloud_sla_cdn)


          * [Уровень обслуживания Yandex
          Cloud](https://yandex.ru/legal/cloud_sla)
links: []
