title: Yandex Query
description:
  - >-
    С 13 октября 2026 года сервис {{ yq-full-name }} будет недоступен для новых
    пользователей.
  - >-
    Текущие пользователи смогут создавать и изменять сущности до 10 ноября 2026
    года. После этого сервис перейдет в режим read-only, а 1 декабря 2026 года
    прекратит работу. Подробнее о сроках и порядке закрытия читайте на странице
    <a href="sunset">Закрытие сервиса</a>.
  - >-
    Yandex Query — интерактивный, полностью управляемый сервис для инженеров
    данных и аналитиков. Сервис позволяет выполнять аналитические и потоковые
    запросы реального времени к структурированным или частично структурированным
    данным с помощью единого диалекта SQL.
